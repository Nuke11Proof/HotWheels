name: Migraciones de Supabase

"on":
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-hotwheels-production
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Comprobar configuración
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Configura el secreto SUPABASE_DB_URL para desplegar migraciones."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v3
        with:
          version: ^3

      - name: Aplicar migraciones pendientes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --yes --remote="$SUPABASE_DB_URL"
